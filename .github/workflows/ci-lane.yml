name: CI lane

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub-hosted runner label
        required: true
        type: string
      node-version:
        description: Node.js version for this independent lane
        required: true
        type: string
      full_suite:
        description: Run the complete Vitest suite instead of the portability smoke group
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: ${{ inputs.runner }} / Node ${{ inputs.node-version }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Install isolated host fixture
        working-directory: tests/fixtures/host-composition
        run: pnpm install --frozen-lockfile
      - name: Run tests
        if: inputs.full_suite && inputs.runner != 'windows-latest'
        run: pnpm test
      # Serialize Git/filesystem fixtures on hosted Windows runners so
      # Vitest can deliver worker updates without changing assertion timeouts.
      - name: Run Windows tests with bounded workers
        if: inputs.full_suite && inputs.runner == 'windows-latest'
        run: pnpm test --maxWorkers=1 --no-file-parallelism
      - name: Run portable platform smoke
        if: ${{ !inputs.full_suite }}
        run: pnpm exec vitest run tests/domain/host-node-conditions.test.ts tests/domain/v030-host-lock.test.ts tests/host-workdir-v070.test.ts tests/v081-windows-shape-certification.test.ts tests/v083-parse-cache.test.ts --maxWorkers=1 --no-file-parallelism
      - name: Exercise native owned-file cleanup
        run: python -m unittest tests.native_cleanup_probe_test
      - name: Test repair-family runner portability
        run: node --test tests/repair-families.node.mjs
      - name: Test warm native tooling portability
        run: node --test tests/native_warm_guard_adapter.node.mjs tests/native_warm_guard_plugin.node.mjs tests/native_warm_scope_consumer.node.mjs tests/native_warm_scope_core.node.mjs
      - name: Test warm native runner and result binding
        run: python -m unittest tests.test_native_warm_acceptance tests.test_native_warm_runtime_copy tests.test_native_warm_schema tests.test_native_warm_scope_preflight tests.test_native_warm_scope_validate
