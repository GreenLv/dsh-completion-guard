name: npm download statistics

on:
  schedule:
    - cron: '37 4,16 * * *'
  workflow_dispatch:

concurrency:
  group: npm-download-statistics
  cancel-in-progress: true

jobs:
  source-guard:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"

  collect:
    needs: source-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test collector
        run: node --test tests/npm-download-stats.node.mjs
      - name: Read previous observations
        env:
          PREVIOUS_DIR: ${{ runner.temp }}/npm-downloads-previous
        run: |
          set -euo pipefail
          mkdir -p "$PREVIOUS_DIR"
          if git ls-remote --exit-code --heads origin stats >/dev/null 2>&1; then
            git fetch origin stats:refs/remotes/origin/stats
            for file in observations.json npm-downloads.json npm-downloads.svg npm-downloads.zh-CN.svg; do
              if git cat-file -e "refs/remotes/origin/stats:$file" 2>/dev/null; then
                git show "refs/remotes/origin/stats:$file" > "$PREVIOUS_DIR/$file"
              fi
            done
          fi
      - name: Collect and validate npm data
        run: node scripts/npm-download-stats.mjs --config .github/npm-downloads-config.json --previous-dir "$RUNNER_TEMP/npm-downloads-previous" --output-dir "$RUNNER_TEMP/npm-downloads"
      - name: Summarize collection freshness
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const status = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/npm-downloads/refresh-status.json`, 'utf8'));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Checked: ${status.checked_at}\n\nAPI available through: ${status.available_through}\n\nChart through: ${status.chart_through}\n\n${status.waiting_for_stability ? 'New or revised observations are awaiting stable repeat checks; the chart contains only previously checked data.' : 'Published the latest available checked data.'}\n`);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-download-statistics
          path: ${{ runner.temp }}/npm-downloads
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-download-statistics
          path: ${{ runner.temp }}/npm-downloads
      - name: Publish stats branch
        env:
          OUTPUT_DIR: ${{ runner.temp }}/npm-downloads
          STATS_WORKTREE: ${{ runner.temp }}/stats-branch
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin stats >/dev/null 2>&1; then
            git fetch origin stats:refs/remotes/origin/stats
            git worktree add --detach "$STATS_WORKTREE"
            git -C "$STATS_WORKTREE" switch -C stats refs/remotes/origin/stats
          else
            git worktree add --detach "$STATS_WORKTREE"
            git -C "$STATS_WORKTREE" switch --orphan stats
          fi
          git -C "$STATS_WORKTREE" rm -rf --ignore-unmatch .
          cp "$OUTPUT_DIR/observations.json" "$STATS_WORKTREE/observations.json"
          cp "$OUTPUT_DIR/npm-downloads.json" "$STATS_WORKTREE/npm-downloads.json"
          cp "$OUTPUT_DIR/npm-downloads.svg" "$STATS_WORKTREE/npm-downloads.svg"
          cp "$OUTPUT_DIR/npm-downloads.zh-CN.svg" "$STATS_WORKTREE/npm-downloads.zh-CN.svg"
          cp "$OUTPUT_DIR/refresh-status.json" "$STATS_WORKTREE/refresh-status.json"
          git -C "$STATS_WORKTREE" add observations.json npm-downloads.json npm-downloads.svg npm-downloads.zh-CN.svg refresh-status.json
          if git -C "$STATS_WORKTREE" diff --cached --quiet; then
            exit 0
          fi
          git -C "$STATS_WORKTREE" config user.name github-actions[bot]
          git -C "$STATS_WORKTREE" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$STATS_WORKTREE" commit -m "chore: update npm download statistics"
          git -C "$STATS_WORKTREE" push origin HEAD:stats
